<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clinic Login</title>

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

        <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<script src="js/prefs-early.js"></script>
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="css/login-extra.css">

</head>

<body>
<!-- HEADER -->

<div class="hero-header">

    <div class="hero-logo">

        <i class="fa-solid fa-tooth"></i>

    </div>

    <h1>Dentimate Pro</h1>

    <p id="tagline">
        منصة إدارة العيادات الطبية الحديثة
    </p>

</div>

<!-- FLOATING ICONS -->

<i class="fa-solid fa-tooth floating-icon icon1"></i>
<i class="fa-solid fa-stethoscope floating-icon icon2"></i>
<i class="fa-solid fa-user-doctor floating-icon icon3"></i>

<!-- LOGIN CARD -->
<div class="login-card">

    <div class="prefs-bar">
        <button type="button" id="langBtn"><i class="fa-solid fa-language"></i> <span id="langText"></span></button>
        <button type="button" id="themeBtn"><i id="themeIcon" class="fa-solid fa-sun"></i> <span id="themeText"></span></button>
    </div>

    <div class="role-tabs" id="roleTabs" role="tablist">
        <button type="button" id="tabManager" role="tab"><i class="fa-solid fa-user-tie"></i> <span id="tabManagerText"></span></button>
        <button type="button" id="tabEmployee" role="tab"><i class="fa-solid fa-user"></i> <span id="tabEmployeeText"></span></button>
    </div>

    <h2 id="cardTitle"></h2>
    <p class="subtitle" id="cardSub"></p>

    <div class="form-error" id="formError" role="alert"></div>

    <div class="input-group">
        <i class="fa-solid fa-envelope"></i>
        <input id="email" type="email" autocomplete="username">
    </div>
    <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input id="password" type="password" autocomplete="current-password">
    </div>
    <div class="input-group hidden" id="grp2">
        <i class="fa-solid fa-lock"></i>
        <input id="password2" type="password" autocomplete="new-password">
    </div>

    <p class="role-hint hidden" id="hintEmployee"></p>

    <button type="button" id="submitBtn">
        <i class="fa-solid fa-right-to-bracket"></i>
        <span id="btnText"></span>
    </button>

    <button type="button" class="link-btn hidden" id="linkNew"></button>
    <button type="button" class="link-btn hidden" id="linkBack"></button>
</div>

<footer>

    <div class="footer-section" id="aboutme">

        <h3>Dentimate PRO</h3>

        <p>
            منصة لإدارة العيادات الطبية وعرض صفحات العيادات
            وحجز المواعيد بسهولة.
        </p>

    </div>

    <div class="footer-section" id="contact-me">

        <h3>تواصل معنا</h3>

        <p>
            <a href="mailto:abdurahman7002@gmail.com">
                📧 abdurahman7002@gmail.com
            </a>
        </p>

        <p>
            <a href="tel:+201107076164">
                📞 +20 110 707 6164
            </a>
        </p>

        <a
            href="https://wa.me/201107076164"
            target="_blank"
            class="whatsapp-contact"
        >
            <img
                src="https://cdn-icons-png.flaticon.com/512/733/733585.png"
                alt="WhatsApp"
            >

            <span>WhatsApp</span>

        </a>

    </div>

    <div class="footer-bottom">

        © 2026 Dentimate - جميع الحقوق محفوظة

    </div>

</footer>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/login.js"></script>

<script>
if ("serviceWorker" in navigator) {
  // Registration can fail (unsupported context, storage policy) without any
  // impact on the app itself - never let it surface as an uncaught error.
  try {
    navigator.serviceWorker.register("service-worker.js").catch(() => {
      console.warn("Service worker registration skipped");
    });
  }
  catch (e) {
    console.warn("Service worker registration skipped");
  }
}
</script>
<!-- toast  -->
<div id="toast" class="toast"></div>

</body>
</html>
