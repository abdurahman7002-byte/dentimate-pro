name: windows-caddy-probe
on:
  workflow_dispatch:
  push:
    branches: [ci-validation]
    paths:
      - '.github/workflows/windows-caddy-probe.yml'
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Caddy on Windows, local TLS, static file
        run: |
          say(){ echo "$1"; echo "::notice title=probe::$1"; }
          mkdir -p /c/probe/web && cd /c/probe
          echo hello > web/index.html
          curl -fsSL -o caddy.zip https://github.com/caddyserver/caddy/releases/download/v2.11.9/caddy_2.11.9_windows_amd64.zip && unzip -q -o caddy.zip -d caddy
          say "caddy-version=$(./caddy/caddy.exe version | head -c 40)"
          printf '{\n  admin off\n  skip_install_trust\n}\nhttps://localhost:8443 {\n  tls internal\n  root * C:/probe/web\n  file_server\n}\n' > Caddyfile
          timeout 10 ./caddy/caddy.exe run --config Caddyfile --adapter caddyfile >dbg.log 2>&1; echo "::notice title=dbg::exit=$? log=$(head -c 1200 dbg.log | tr '\n' ' ' | tr -d '\r"')"
          (./caddy/caddy.exe run --config Caddyfile --adapter caddyfile >run.log 2>&1 &)
          for i in $(seq 1 20); do curl -sk -o /dev/null https://localhost:8443/ && break; sleep 1; done
          say "wait-iterations=$i"
          say "https-http=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/index.html)"
          echo "::notice title=runlog::$(head -c 600 run.log | tr '\n' ' ' | tr -d '\r"')"
