name: windows-native-spike
# Feasibility spike (synthetic data only): can the clinic backend run as
# native Windows binaries with no Docker? Booleans/labels only in output.
on:
  workflow_dispatch:
  push:
    branches: [ci-validation]
    paths:
      - '.github/workflows/windows-spike.yml'
      - 'local-edition/packaging/windows/**'
jobs:
  spike:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Stage 1 - stock PostgreSQL 17 zip binaries on Windows
        run: |
          say(){ echo "$1"; echo "::notice title=spike::$1"; }
          set -u
          REPO="$(pwd)"
          mkdir -p /c/spike && cd /c/spike
          got=""
          for v in 17.12-1 17.11-1 17.10-1 17.9-1 17.8-1 17.7-1 17.6-1 17.5-1; do
            url="https://get.enterprisedb.com/postgresql/postgresql-$v-windows-x64-binaries.zip"
            if curl -fsIL "$url" >/dev/null 2>&1; then got="$v"; curl -fsSL -o pg.zip "$url"; break; fi
          done
          if [ -z "$got" ]; then echo "::error title=stage1::no EDB 17 zip url resolved"; exit 1; fi
          say "stage1-edb-zip-version=$got"
          unzip -q pg.zip
          PGBIN="/c/spike/pgsql/bin"
          say "stage1-binaries-present=$([ -x $PGBIN/pg_ctl.exe ] && echo 1 || echo 0)"
          "$PGBIN/initdb.exe" -D /c/spike/data -U postgres --auth=trust -E UTF8 >/dev/null
          "$PGBIN/pg_ctl.exe" -D /c/spike/data -o "-p 54329" -l /c/spike/pg.log -w start >/dev/null
          "$PGBIN/psql.exe" -h 127.0.0.1 -p 54329 -U postgres -tAc "select 'pg-major=' || current_setting('server_version_num')::int/10000"
          "$PGBIN/psql.exe" -h 127.0.0.1 -p 54329 -U postgres -v ON_ERROR_STOP=1 -c "create extension if not exists \"uuid-ossp\"; create extension if not exists pgcrypto;" >/dev/null && say "stage1-extensions-uuid-pgcrypto=1" || { echo "::error title=stage1::extensions failed"; exit 1; }
          PGP="spk-$(openssl rand -hex 12)"
          echo "$PGP" > /c/spike/pgpass.txt
          "$PGBIN/psql.exe" -h 127.0.0.1 -p 54329 -U postgres -v ON_ERROR_STOP=1 -v pgpass="$PGP" -f "$REPO/local-edition/packaging/windows/bootstrap-roles.sql" >/c/spike/roles.log 2>&1 && say "stage1-roles=1" || { echo "::error title=stage1::roles sql failed: $(grep -i -m3 error /c/spike/roles.log | cut -c1-200 | tr '\n' ' ')"; exit 1; }
      - name: Stage 3a - build Supabase Auth (GoTrue) for Windows
        run: |
          say(){ echo "$1"; echo "::notice title=spike::$1"; }
          cd /c/spike
          git clone -q --depth 1 --branch v2.198.0 https://github.com/supabase/auth.git auth-src || { echo "::error title=stage3::clone failed"; exit 1; }
          cd auth-src
          go version
          # Finding from the first run: cmd/serve_cmd.go uses unix.SO_REUSEPORT, which does not
          # exist on Windows. Spike-only patch: skip the socket option and drop the unix import.
          say "stage3-unix-import-files=$(grep -rl 'golang.org/x/sys/unix' --include=*.go . | tr '\n' ' ')"
          sed -i 's|serr = unix.SetsockoptInt(int(fd), unix.SOL_SOCKET, unix.SO_REUSEPORT, 1).*|_ = fd|' cmd/serve_cmd.go
          sed -i '/"golang.org\/x\/sys\/unix"/d' cmd/serve_cmd.go
          go build -o ../auth.exe . 2>/c/spike/gobuild.log && say "stage3-auth-build=1" || { echo "::error title=stage3::go build failed: $(tail -c 300 /c/spike/gobuild.log | tr '\n' ' ')"; exit 1; }
          ls migrations | wc -l | sed 's/^/stage3-migration-files=/'
      - name: Stage 3b - run Auth migrations + serve on Windows
        run: |
          say(){ echo "$1"; echo "::notice title=spike::$1"; }
          cd /c/spike/auth-src
          PGP="$(cat /c/spike/pgpass.txt)"
          export GOTRUE_DB_DRIVER=postgres
          export DATABASE_URL="postgres://supabase_auth_admin:$PGP@127.0.0.1:54329/postgres?sslmode=disable"
          export GOTRUE_DB_DATABASE_URL="$DATABASE_URL"
          export GOTRUE_DB_MIGRATIONS_PATH=/c/spike/auth-src/migrations
          export GOTRUE_API_HOST=127.0.0.1 GOTRUE_API_PORT=9999 API_EXTERNAL_URL=http://127.0.0.1:9999
          export GOTRUE_SITE_URL=http://127.0.0.1 GOTRUE_JWT_SECRET="spike-jwt-$(openssl rand -hex 24)" GOTRUE_JWT_EXP=3600
          export GOTRUE_JWT_AUD=authenticated GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated GOTRUE_JWT_ADMIN_ROLES=service_role
          export GOTRUE_EXTERNAL_EMAIL_ENABLED=true GOTRUE_MAILER_AUTOCONFIRM=true GOTRUE_DISABLE_SIGNUP=false
          echo "$GOTRUE_JWT_SECRET" > /c/spike/jwt.txt
          (../auth.exe migrate >/c/spike/migrate.log 2>&1) && say "stage3-auth-migrate=1" || { echo "::error title=stage3::migrate failed: $(tail -c 400 /c/spike/migrate.log | tr '\n' ' ' | sed "s/$PGP/***/g")"; exit 1; }
          (../auth.exe serve >/c/spike/auth.log 2>&1 &) ; sleep 6
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9999/health)
          say "stage3-auth-health-http=$code"
          [ "$code" = "200" ] || { echo "::error title=stage3::auth health $code: $(tail -c 300 /c/spike/auth.log | tr '\n' ' ' | sed "s/$PGP/***/g")"; exit 1; }
          say "stage3-auth-uid-function=$(/c/spike/pgsql/bin/psql.exe -h 127.0.0.1 -p 54329 -U postgres -tAc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='auth' and p.proname='uid'")"
      - name: Stage 2 - repo schema + RLS on stock Windows Postgres
        run: |
          say(){ echo "$1"; echo "::notice title=spike::$1"; }
          PSQL="/c/spike/pgsql/bin/psql.exe -h 127.0.0.1 -p 54329 -U postgres"
          for f in zz10-schema zz20-employees zz30-rls; do
            $PSQL -v ON_ERROR_STOP=1 -f local-edition/packaging/init/$f.sql >/c/spike/$f.log 2>&1 && say "stage2-$f=1" || { echo "::error title=stage2::$f failed: $(grep -i -m3 -E 'error' /c/spike/$f.log | cut -c1-220 | tr '\n' ' ')"; exit 1; }
          done
          say "stage2-public-tables=$($PSQL -tAc "select count(*) from pg_tables where schemaname='public'")"
          $PSQL -c "grant select, insert, update, delete on all tables in schema public to authenticated; grant usage on all sequences in schema public to authenticated; grant execute on all functions in schema public to anon, authenticated; grant all on all tables in schema public to service_role; grant all on all sequences in schema public to service_role; grant execute on all functions in schema public to service_role;" >/dev/null && say "stage2-grants=1"
      - name: Stage 2b - PostgREST Windows release + authenticated query
        run: |
          say(){ echo "$1"; echo "::notice title=spike::$1"; }
          cd /c/spike
          curl -fsSL -o pgrst.zip https://github.com/PostgREST/postgrest/releases/download/v14.18/postgrest-v14.18-windows-x86-64.zip && unzip -q -o pgrst.zip -d pgrst && say "stage2b-postgrest-downloaded=1" || { echo "::error title=stage2b::postgrest download"; exit 1; }
          PGP="$(cat pgpass.txt)"; JWT="$(cat jwt.txt)"
          cat > pgrst.conf <<CONF
          db-uri = "postgres://authenticator:$PGP@127.0.0.1:54329/postgres"
          db-schemas = "public"
          db-anon-role = "anon"
          jwt-secret = "$JWT"
          server-host = "127.0.0.1"
          server-port = 3000
          CONF
          sed -i 's/^ *//' pgrst.conf
          (./pgrst/postgrest.exe pgrst.conf >pgrst.log 2>&1 &) ; sleep 6
          say "stage2b-postgrest-root-http=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)"
          # sign up a synthetic user through Auth, then query with its JWT
          EM="spike-$(openssl rand -hex 4)@example.test"; PW="Spk-$(openssl rand -hex 10)"
          tok=$(curl -s -X POST http://127.0.0.1:9999/signup -H 'Content-Type: application/json' -d "{\"email\":\"$EM\",\"password\":\"$PW\"}" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
          say "stage3-signup-got-token=$([ -n "$tok" ] && echo 1 || echo 0)"
          [ -n "$tok" ] || { echo "::error title=stage3::signup produced no token: $(tail -c 300 auth.log 2>/dev/null)"; exit 1; }
          say "stage2b-authenticated-query-http=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $tok" http://127.0.0.1:3000/patients?select=id)"
          say "stage2b-anon-query-http=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/patients?select=id)"
          say "stage2b-rpc-is_admin-http=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $tok" http://127.0.0.1:3000/rpc/is_admin)"
      - name: Stage 4 - Node provision server on Windows (non-owner must be refused)
        run: |
          say(){ echo "$1"; echo "::notice title=spike::$1"; }
          cd /c/spike
          JWT="$(cat jwt.txt)"
          SVC=$(JWT="$JWT" node -e "const c=require('crypto');const b=o=>Buffer.from(JSON.stringify(o)).toString('base64url');const h=b({alg:'HS256',typ:'JWT'})+'.'+b({role:'service_role',iss:'spike',exp:Math.floor(Date.now()/1000)+3600});console.log(h+'.'+c.createHmac('sha256',process.env.JWT).update(h).digest('base64url'))")
          say "stage4-node-version=$(node -v)"
          (SERVICE_ROLE_JWT="$SVC" ALLOWED_ORIGINS="https://clinic.lan" node "$GITHUB_WORKSPACE/local-edition/server/provision-server.mjs" >/c/spike/prov.log 2>&1 &) ; sleep 4
          say "stage4-not-found-http=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9090/nope)"
          EM="spike-$(openssl rand -hex 4)@example.test"; PW="Spk-$(openssl rand -hex 10)"
          tok=$(curl -s -X POST http://127.0.0.1:9999/signup -H 'Content-Type: application/json' -d "{\"email\":\"$EM\",\"password\":\"$PW\"}" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
          code=$(curl -s -o /c/spike/prov-body.txt -w '%{http_code}' -X POST http://127.0.0.1:9090/provision -H 'Content-Type: application/json' -H "Authorization: Bearer $tok" -d '{"employee_id":"00000000-0000-0000-0000-000000000000"}')
          say "stage4-nonowner-provision-http=$code reason=$(sed -n 's/.*"reason":"\([a-z_]*\)".*/\1/p' /c/spike/prov-body.txt)"
          code2=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:9090/provision -H 'Content-Type: application/json' -H 'Origin: https://evil.example' -d '{"employee_id":"x"}')
          say "stage4-bad-origin-http=$code2"
          [ "$code" = "403" ] && [ "$code2" = "403" ] || { echo "::error title=stage4::unexpected codes $code $code2: $(tail -c 300 /c/spike/prov.log | tr '\n' ' ')"; exit 1; }
      - name: Stage 5 - owner bootstrap + Caddy TLS web serving on Windows
        run: |
          say(){ echo "$1"; echo "$1" >> /c/spike/sum5.txt; }
          trap 'echo "::notice title=stage5-summary::$(tr "\n" " " </c/spike/sum5.txt)"' EXIT
          cd /c/spike
          JWT="$(cat jwt.txt)"
          mint(){ ROLE="$1" JWT="$JWT" node -e "const c=require('crypto');const b=o=>Buffer.from(JSON.stringify(o)).toString('base64url');const h=b({alg:'HS256',typ:'JWT'})+'.'+b({role:process.env.ROLE,iss:'spike',exp:Math.floor(Date.now()/1000)+3600});console.log(h+'.'+c.createHmac('sha256',process.env.JWT).update(h).digest('base64url'))"; }
          ANON=$(mint anon)
          # 5a owner bootstrap through the repo's own script (piped stdin; password synthetic)
          OWNER_EM="owner-$(openssl rand -hex 4)@example.test"; OWNER_PW="Own-$(openssl rand -hex 10)"
          printf '%s\n%s\n' "$OWNER_EM" "$OWNER_PW" > /c/spike/owner.txt
          printf '%s\n%s\n%s\n' "$OWNER_EM" "$OWNER_PW" "$OWNER_PW" | node "$GITHUB_WORKSPACE/local-edition/server/bootstrap-owner.mjs" >/c/spike/boot.log 2>&1 && say "stage5-owner-bootstrap=1" || { echo "::error title=stage5::owner bootstrap failed: $(tail -c 300 /c/spike/boot.log | tr '\n' ' ')"; exit 1; }
          printf '%s\n%s\n%s\n' "x-$OWNER_EM" "$OWNER_PW" "$OWNER_PW" | node "$GITHUB_WORKSPACE/local-edition/server/bootstrap-owner.mjs" >/c/spike/boot2.log 2>&1 && say "stage5-second-bootstrap-refused=0" || say "stage5-second-bootstrap-refused=1"
          # 5b web root by the repo's allowlist script, with a synthetic config
          cd "$GITHUB_WORKSPACE/local-edition"
          printf "window.DENTIX_CONFIG={SUPABASE_URL:'https://localhost:8443',SUPABASE_ANON_KEY:'%s'};\n" "$ANON" > js/config.local.js
          sh packaging/build-web.sh >/c/spike/web.log 2>&1 && say "stage5-web-built=1" || { echo "::error title=stage5::build-web failed: $(tail -c 300 /c/spike/web.log | tr '\n' ' ')"; exit 1; }
          WEB="$(cygpath -m "$GITHUB_WORKSPACE/local-edition/packaging/web")"
          say "stage5-web-files=$(find packaging/web -type f | wc -l)"
          # 5c Caddy for Windows
          cd /c/spike
          curl -fsSL -o caddy.zip https://github.com/caddyserver/caddy/releases/download/v2.11.9/caddy_2.11.9_windows_amd64.zip && unzip -q -o caddy.zip -d caddy && say "stage5-caddy-downloaded=1" || { echo "::error title=stage5::caddy download"; exit 1; }
          cat > Caddyfile <<CF
          {
            admin off
            skip_install_trust
            auto_https disable_redirects
          }
          https://localhost:8443 {
            tls internal
            encode gzip
            handle_path /rest/v1/* {
              reverse_proxy 127.0.0.1:3000
            }
            handle_path /auth/v1/* {
              reverse_proxy 127.0.0.1:9999
            }
            @prov path /provision /reset-password /account
            handle @prov {
              reverse_proxy 127.0.0.1:9090
            }
            handle {
              root * $WEB
              file_server
            }
          }
          CF
          sed -i 's/^ \{10\}//' Caddyfile
          ./caddy/caddy.exe validate --config Caddyfile --adapter caddyfile >caddy-validate.log 2>&1 && say "stage5-caddyfile-valid=1" || { echo "::error title=stage5::caddy validate: $(tail -c 300 caddy-validate.log | tr '\n' ' ')"; exit 1; }
          timeout 10 ./caddy/caddy.exe run --config Caddyfile --adapter caddyfile >caddy-dbg.log 2>&1 || true; echo "::notice title=caddydbg::exit=$? log=$(head -c 900 caddy-dbg.log | tr '\n' ' ' | tr -d '\r' | tr -d '"')"
          (./caddy/caddy.exe run --config Caddyfile --adapter caddyfile >caddy.log 2>&1 &)
          for i in $(seq 1 30); do curl -sk -o /dev/null https://localhost:8443/ && break; sleep 1; done
          say "stage5-caddy-wait-iterations=$i"
          echo "::notice title=caddylog::$(tail -c 500 caddy.log | tr '\n' ' ' | tr -d '\r')"
          tasklist //FI "IMAGENAME eq caddy.exe" 2>/dev/null | grep -ci caddy | sed 's/^/stage5-caddy-process-count=/' | while read l; do say "$l"; done
          say "stage5-https-index-http=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/index.html)"
          say "stage5-https-config-served=$(curl -sk https://localhost:8443/js/config.local.js | grep -c DENTIX_CONFIG)"
          say "stage5-blocked-server-dir-http=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/server/provision-server.mjs)"
          say "stage5-blocked-packaging-http=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/packaging/build-web.sh)"
          # 5d owner sign-in over HTTPS through the proxy, then authed REST and the owner-only endpoint
          tok=$(curl -sk -X POST 'https://localhost:8443/auth/v1/token?grant_type=password' -H "apikey: $ANON" -H 'Content-Type: application/json' -d "{\"email\":\"$OWNER_EM\",\"password\":\"$OWNER_PW\"}" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
          say "stage5-owner-login-token=$([ -n "$tok" ] && echo 1 || echo 0)"
          say "stage5-owner-rest-patients-http=$(curl -sk -o /dev/null -w '%{http_code}' -H "apikey: $ANON" -H "Authorization: Bearer $tok" 'https://localhost:8443/rest/v1/patients?select=id')"
          say "stage5-anon-rest-patients-http=$(curl -sk -o /dev/null -w '%{http_code}' -H "apikey: $ANON" -H "Authorization: Bearer $ANON" 'https://localhost:8443/rest/v1/patients?select=id')"
          say "stage5-owner-is_admin=$(curl -sk -X POST -H "apikey: $ANON" -H "Authorization: Bearer $tok" https://localhost:8443/rest/v1/rpc/is_admin | head -c 20)"
          say "stage5-owner-provision-http=$(curl -sk -o /c/spike/p5.txt -w '%{http_code}' -X POST https://localhost:8443/provision -H 'Content-Type: application/json' -H 'Origin: https://clinic.lan' -H "Authorization: Bearer $tok" -d '{"employee_id":"00000000-0000-0000-0000-000000000000"}') reason=$(sed -n 's/.*"error":"\([^"]*\)".*/\1/p' /c/spike/p5.txt | head -c 60)"
          [ -n "$tok" ] || { echo "::error title=stage5::owner login failed: $(tail -c 300 /c/spike/auth.log | tr '\n' ' ')"; exit 1; }
      - name: Stage 6 prep - Node 26 (storage-api engine requirement)
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Stage 6 - Supabase storage-api (Node, file backend) on Windows
        if: always()
        run: |
          set +e
          say(){ echo "$1"; echo "$1" >> /c/spike/sum6.txt; }
          trap 'echo "::notice title=stage6-summary::$(tr "\n" " " </c/spike/sum6.txt)"' EXIT
          cd /c/spike
          PGB=/c/spike/pgsql/bin/psql.exe; PGP="$(cat pgpass.txt)"; JWT="$(cat jwt.txt)"
          mint(){ ROLE="$1" JWT="$JWT" node -e "const c=require('crypto');const b=o=>Buffer.from(JSON.stringify(o)).toString('base64url');const h=b({alg:'HS256',typ:'JWT'})+'.'+b({role:process.env.ROLE,iss:'spike',exp:Math.floor(Date.now()/1000)+3600});console.log(h+'.'+c.createHmac('sha256',process.env.JWT).update(h).digest('base64url'))"; }
          ANON=$(mint anon); SVC=$(mint service_role)
          git clone -q --depth 1 --branch v1.98.6 https://github.com/supabase/storage.git storage-src && say "stage6-clone=1" || { echo "::error title=stage6::storage clone failed"; exit 1; }
          cd storage-src
          say "stage6-node=$(node -v) npm=$(npm -v)"
          export npm_config_engine_strict=false
          # fs-xattr is POSIX-only (EBADPLATFORM). Install ignoring platform + scripts, then swap in the NTFS-stream shim.
          npm ci --force --ignore-scripts --no-audit --no-fund >/c/spike/npmci.log 2>&1 && say "stage6-npm-ci=1" || { echo "::error title=stage6::npm ci failed: $(tail -c 400 /c/spike/npmci.log | tr '\n' ' ' | tr -d '"')"; exit 1; }
          rm -rf node_modules/fs-xattr && mkdir -p node_modules/fs-xattr && cp "$GITHUB_WORKSPACE/local-edition/packaging/windows/xattr-shim/"* node_modules/fs-xattr/ && say "stage6-xattr-shim=1"
          npm run build >/c/spike/npmbuild.log 2>&1 && say "stage6-build=1" || { echo "::error title=stage6::build failed: $(tail -c 500 /c/spike/npmbuild.log | tr '\n' ' ' | tr -d '"')"; exit 1; }
          ls dist/start >/c/spike/dist.txt 2>&1; say "stage6-dist-start=$(tr '\n' ',' </c/spike/dist.txt)"
          $PGB -h 127.0.0.1 -p 54329 -U postgres -c "grant create on database postgres to supabase_storage_admin; grant usage on schema public to supabase_storage_admin;" >/dev/null
          mkdir -p /c/spike/storage-data
          export DATABASE_URL="postgres://supabase_storage_admin:$PGP@127.0.0.1:54329/postgres" DATABASE_POOL_URL="" 
          export ANON_KEY="$ANON" SERVICE_KEY="$SVC" AUTH_JWT_SECRET="$JWT" PGRST_JWT_SECRET="$JWT" POSTGREST_URL=http://127.0.0.1:3000
          export SERVER_PORT=5000 SERVER_HOST=127.0.0.1 PORT=5000 STORAGE_BACKEND=file FILE_STORAGE_BACKEND_PATH=C:/spike/storage-data GLOBAL_S3_BUCKET=stub
          export TENANT_ID=clinic REGION=local FILE_SIZE_LIMIT=52428800 ENABLE_IMAGE_TRANSFORMATION=false DB_INSTALL_ROLES=false
          export REQUEST_ALLOW_X_FORWARDED_PATH=true STORAGE_PUBLIC_URL=https://localhost:8443 UPLOAD_FILE_SIZE_LIMIT=52428800 UPLOAD_FILE_SIZE_LIMIT_STANDARD=52428800
          export S3_PROTOCOL_ACCESS_KEY_ID=spikekey S3_PROTOCOL_ACCESS_KEY_SECRET=spikesecret IS_MULTITENANT=false
          (node dist/start/server.js >/c/spike/storage.log 2>&1 &)
          for i in $(seq 1 40); do curl -s -o /dev/null http://127.0.0.1:5000/status && break; sleep 2; done
          say "stage6-storage-status-http=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/status)"
          echo "::notice title=storagelog::$(tail -c 700 /c/spike/storage.log | tr '\n' ' ' | tr -d '\r"' | sed "s/$PGP/***/g")"
          say "stage6-storage-schema-tables=$($PGB -h 127.0.0.1 -p 54329 -U postgres -tAc "select count(*) from information_schema.tables where table_schema='storage'")"
          # 6b: bucket policies + upload/download as the owner (all synthetic)
          $PGB -h 127.0.0.1 -p 54329 -U postgres -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/local-edition/packaging/init/zz40-storage.sql" >/c/spike/zz40.log 2>&1 && say "stage6-zz40=1" || say "stage6-zz40=0 err=$(grep -i -m2 error /c/spike/zz40.log | cut -c1-160 | tr '\n' ' ')"
          $PGB -h 127.0.0.1 -p 54329 -U postgres -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/local-edition/packaging/post-boot-storage.sql" >/c/spike/pbs.log 2>&1 && say "stage6-postboot=1" || say "stage6-postboot=0 err=$(grep -i -m2 error /c/spike/pbs.log | cut -c1-160 | tr '\n' ' ')"
          OWNER_EM=$(sed -n 1p /c/spike/owner.txt); OWNER_PW=$(sed -n 2p /c/spike/owner.txt)
          tok=$(curl -s -X POST 'http://127.0.0.1:9999/token?grant_type=password' -H 'Content-Type: application/json' -d "{\"email\":\"$OWNER_EM\",\"password\":\"$OWNER_PW\"}" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
          UID_=$(curl -s http://127.0.0.1:9999/user -H "apikey: $ANON" -H "Authorization: Bearer $tok" | sed -n 's/.*"id":"\([0-9a-f-]*\)".*/\1/p' | head -1)
          say "stage6-owner-token=$([ -n "$tok" ] && echo 1 || echo 0) uid=$([ -n "$UID_" ] && echo 1 || echo 0)"
          echo "synthetic patient file $(date +%s)" > /c/spike/up.txt
          code=$(curl -s -o /c/spike/up.out -w '%{http_code}' -X POST "http://127.0.0.1:5000/object/patient-files/$UID_/patient-files/t1.txt" -H "apikey: $ANON" -H "Authorization: Bearer $tok" -H 'Content-Type: text/plain' --data-binary @/c/spike/up.txt)
          say "stage6-owner-upload-http=$code body=$(head -c 120 /c/spike/up.out | tr '\n' ' ')"
          code=$(curl -s -o /c/spike/down.txt -D /c/spike/down.hdr -w '%{http_code}' "http://127.0.0.1:5000/object/authenticated/patient-files/$UID_/patient-files/t1.txt" -H "apikey: $ANON" -H "Authorization: Bearer $tok")
          say "stage6-owner-download-http=$code same=$(cmp -s /c/spike/up.txt /c/spike/down.txt && echo 1 || echo 0) ctype=$(grep -i '^content-type' /c/spike/down.hdr | head -c 60 | tr -d '\r')"
          say "stage6-anon-download-http=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:5000/object/authenticated/patient-files/$UID_/patient-files/t1.txt" -H "apikey: $ANON" -H "Authorization: Bearer $ANON")"
          say "stage6-anon-public-private-bucket-http=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:5000/object/public/patient-files/$UID_/patient-files/t1.txt")"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:5000/object/clinic-assets/$UID_/logo/a.txt" -H "apikey: $ANON" -H "Authorization: Bearer $tok" -H 'Content-Type: text/plain' --data-binary @/c/spike/up.txt)
          say "stage6-asset-upload-http=$code public-read-http=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:5000/object/public/clinic-assets/$UID_/logo/a.txt")"
          say "stage6-ads-streams-on-disk=$(cmd //c "dir /r C:\\spike\\storage-data /s" 2>/dev/null | grep -c ':\$DATA')"
