# Dentix minimal audited extension.
# Run from packaging/official (relative paths below resolve against the FIRST -f file):
#   cd packaging/official
#   docker compose -f docker-compose.yml -f docker-compose.pg17.yml -f docker-compose.kong.yml \
#       -f ../docker-compose.dentix-override.yml --env-file .env.dentix up -d
# (docker-compose.pg17.yml pins supabase/postgres:17.6.1.136. Schema was retested on PG17.12
#  native binaries: same major, NOT the exact image; exact-image retest is a first-boot gate.)
#
# Network exposure audit (against official defaults, 2026-11-25):
#   - supavisor publishes Postgres 5432 + pooler 6543 on ALL interfaces by default -> localhost-only here.
#   - api-gw publishes 8000 (+8443 via kong override) plaintext on ALL interfaces -> localhost-only here;
#     all clinic traffic enters via the nginx TLS service on 443 (it proxies /rest /auth /storage
#     /realtime to the gateway and /provision /reset-password to the provision service).
#   - Studio dashboard is reachable through the gateway with BASIC-AUTH DEFAULT credentials
#     (.env.example: DASHBOARD_USERNAME=supabase / placeholder password) -> gateway localhost-only
#     closes it from the LAN; .env.dentix must still regenerate DASHBOARD_PASSWORD.
#   - .env.example ships DISABLE_SIGNUP=false -> .env.dentix sets DISABLE_SIGNUP=true
#     (accounts are owner-provisioned only).
#   - db itself publishes nothing upstream (only via supavisor). analytics/imgproxy have no
#     published ports upstream; they stay internal. Studio runs but is unreachable off-host.
services:
  api-gw:
    ports: !override
      - "127.0.0.1:${KONG_HTTP_PORT:-8000}:8000/tcp"
      - "127.0.0.1:${KONG_HTTPS_PORT:-8443}:8443/tcp"

  supavisor:
    # DISABLED by default (opt-in profile): the Dentix LAN app never uses the
    # transaction pooler - nginx proxies to Kong; PostgREST/GoTrue/Storage/
    # Realtime connect to db directly; no service depends_on supavisor, and
    # the CI gates exercise none of its ports. Running it only widened the
    # localhost surface the audit above closes. Evidence (CI runs 5-7,
    # 2026-11-26): its in-container migrate/eval fail on the 2.10.1 image with
    # no usable error output while every dependent-side probe passes.
    # Enable with: docker compose ... --profile pooler up -d
    profiles: ["pooler"]
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT}:5432"
      - "127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION}:6543"

  realtime:
    # give the BEAM release 30s to close connections cleanly on
    # `docker restart` (default 10s -> SIGKILL): a clean exit closes the
    # replication walsender immediately, so realtime's own recovery does not
    # have to wait out the dead-sender window at all.
    stop_grace_period: 30s

  db:
    # wal_sender_timeout 30s (image default 60s): when the realtime container is
    # restarted, Postgres keeps serving its dead walsender until this timeout,
    # and realtime v2.174.6 refuses to rebuild replication while an old
    # walsender is visible (connect.ex: "Waiting for old walsender to exit",
    # retried on a hardcoded 5s..5min rand_exp backoff). Halving the window
    # halves worst-case notification-outage time after a realtime crash; an
    # unclean stop (power cut) is bounded by this same timeout. command
    # replaces (not merges) the upstream list, so the upstream flags repeat.
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_min_messages=fatal",
        "-c",
        "wal_sender_timeout=30s"
      ]
    volumes:
      - ../init/zz10-schema.sql:/docker-entrypoint-initdb.d/init-scripts/zz10-schema.sql:Z
      - ../init/zz20-employees.sql:/docker-entrypoint-initdb.d/init-scripts/zz20-employees.sql:Z
      - ../init/zz30-rls.sql:/docker-entrypoint-initdb.d/init-scripts/zz30-rls.sql:Z
      - ../init/zz40-storage.sql:/docker-entrypoint-initdb.d/init-scripts/zz40-storage.sql:Z

  provision:
    build:
      context: ../../server
      dockerfile: Dockerfile
    environment:
      GOTRUE_URL: http://auth:9999
      POSTGREST_URL: http://rest:3000
      SERVICE_ROLE_JWT: ${SERVICE_ROLE_KEY}
      ALLOWED_ORIGIN: https://${LAN_HOST}
      PROVISION_PORT: "9090"
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:1.29-alpine
    volumes:
      - ../web:/usr/share/nginx/html:ro        # allowlist export from build-web.sh
      - ../nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../certs:/etc/nginx/certs:ro           # LAN TLS cert + key, generated at install
    ports:
      - "443:443"
    depends_on:
      rest:
        condition: service_healthy
      auth:
        condition: service_healthy
    restart: unless-stopped
