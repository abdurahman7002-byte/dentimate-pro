# Trial profile override (GitHub Codespaces): replaces the TLS-only web
# listener with the trial plain-HTTP listener on 8080 inside the VM. The
# Codespaces edge terminates TLS; keep the forwarded port PRIVATE (anyone
# with a PUBLIC port URL can open the app without authenticating to GitHub).
# Use LAST in the -f chain:
#   docker compose -f docker-compose.yml -f docker-compose.pg17.yml \
#     -f docker-compose.kong.yml -f ../docker-compose.dentix-override.yml \
#     -f ../trial/docker-compose.trial.yml --env-file .env.dentix up -d --wait
services:
  provision:
    environment:
      # Same-origin guard for the trial: an EXACT-MATCH list (no wildcard)
      # of the two deterministic forms of the one trial origin:
      #   1. http://localhost:8080 - the Codespaces forwarding edge rewrites
      #      the browser's Origin header to the internal listener origin
      #      (verified live 2026-11-26, and some clients pass it through)
      #   2. $TRIAL_PUBLIC_ORIGIN - the configured public trial origin
      #      (https://<codespace>-8080.app.github.dev), exported by
      #      start-trial.sh; "disabled" matches nothing when unset (CI).
      # The LAN profile keeps its own ALLOWED_ORIGIN=https://LAN_HOST.
      ALLOWED_ORIGINS: "http://localhost:8080,${TRIAL_PUBLIC_ORIGIN:-disabled}"

  web:
    volumes: !override
      - ../web:/usr/share/nginx/html:ro
      - ../trial/nginx-trial.conf:/etc/nginx/conf.d/default.conf:ro
    ports: !override
      - "8080:8080/tcp"
