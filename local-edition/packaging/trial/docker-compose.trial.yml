# Trial profile override (GitHub Codespaces): replaces the TLS-only web
# listener with the trial plain-HTTP listener on 8080 inside the VM. The
# Codespaces edge terminates TLS; keep the forwarded port PRIVATE (anyone
# with a PUBLIC port URL can open the app without authenticating to GitHub).
# Use LAST in the -f chain:
#   docker compose -f docker-compose.yml -f docker-compose.pg17.yml \
#     -f docker-compose.kong.yml -f ../docker-compose.dentix-override.yml \
#     -f ../trial/docker-compose.trial.yml --env-file .env.dentix up -d --wait
services:
  provision:
    environment:
      # Same-origin guard value for the trial. The Codespaces forwarding
      # edge rewrites the browser's Origin header to the internal listener
      # origin before the request reaches this container (verified against
      # a live codespace 2026-11-26), so the only browser origin this
      # server ever sees is the plain-HTTP trial listener itself. Strict
      # single origin - NOT a wildcard; the LAN profile keeps its own
      # https://LAN_HOST value from the dentix override.
      ALLOWED_ORIGIN: http://localhost:8080

  web:
    volumes: !override
      - ../web:/usr/share/nginx/html:ro
      - ../trial/nginx-trial.conf:/etc/nginx/conf.d/default.conf:ro
    ports: !override
      - "8080:8080/tcp"
