# Dentix TRIAL web profile (GitHub Codespaces): plain HTTP on 8080 INSIDE the
# codespace VM. TLS is terminated by the Codespaces port-forwarding edge
# (https://<codespace>-8080.app.github.dev); the browser never sees plain
# HTTP. Same allowlist static serving + API proxy as nginx.conf, minus TLS.
# Do NOT use this file for the LAN deployment - that one is TLS-only.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
    }
    # API + realtime via Kong (official gateway, keeps its own route ACLs)
    location ~ ^/(rest|auth|storage|realtime)/ {
        proxy_pass http://kong:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    # provisioning endpoint (owner-only, enforced by provision-server itself)
    location ~ ^/(provision|reset-password|account)$ {
        proxy_pass http://provision:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
