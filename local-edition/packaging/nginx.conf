# Dentix web: TLS termination + ALLOWLIST static serving + API proxy to Kong.
# Nothing outside the allowlist is served: no sql/, server/, tests/, packaging/,
# docs/, *.md, .git, and no config.local.js from the repo (generated at install).
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/dentix.crt;
    ssl_certificate_key /etc/nginx/certs/dentix.key;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
    }
    # API + realtime via Kong (official gateway, keeps its own route ACLs)
    location ~ ^/(rest|auth|storage|realtime)/ {
        proxy_pass http://kong:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    # provisioning endpoint (owner-only, enforced by provision-server itself)
    location ~ ^/(provision|reset-password)$ {
        proxy_pass http://provision:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
